<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coleções de baralho — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=Chakra+Petch:wght@600;700&family=Righteous&family=Audiowide&family=Cinzel+Decorative:wght@700;900&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --feltro: #2b0f15;
    --feltro-2: #3a1720;
    --texto: #f1e7d6;
    --texto-2: #c9b79c;
    --ouro: #c99a3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #4a1c27 0%, transparent 70%),
      var(--feltro);
    color: var(--texto);
    font: 16px/1.5 "Hanken Grotesk", system-ui, sans-serif;
  }
  header { max-width: 1180px; margin: 0 auto; padding: 56px 24px 8px; }
  header h1 { font: 800 clamp(30px, 4vw, 44px)/1.1 "Bricolage Grotesque", sans-serif; margin: 0 0 10px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--texto-2); max-width: 62ch; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 24px 80px; }
  .colecao {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
    padding: 36px 0;
    border-top: 1px solid rgba(241, 231, 214, 0.12);
  }
  .info h2 { margin: 0 0 6px; font-size: 26px; line-height: 1.15; }
  .info p { margin: 0 0 14px; color: var(--texto-2); font-size: 15px; }
  .info .preco { color: var(--ouro); font-weight: 600; font-size: 15px; }
  .mesa {
    display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap;
  }
  .carta {
    width: 150px; aspect-ratio: 250 / 350; border-radius: 11px; overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 14px 28px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.4);
    transition: transform .25s ease;
  }
  .carta svg { display: block; width: 100%; height: 100%; }
  .carta.verso { transform: rotate(-4deg); margin-right: 8px; }
  .carta:hover { transform: translateY(-6px); }
  .carta.verso:hover { transform: rotate(-4deg) translateY(-6px); }
  @media (max-width: 760px) {
    .colecao { grid-template-columns: 1fr; gap: 18px; }
    .carta { width: calc((100% - 54px) / 4); min-width: 70px; }
    .carta.verso { margin-right: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .carta { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Seis baralhos para a loja</h1>
  <p>Prévia para aprovação: o verso de cada coleção e três cartas (Ás de espadas, Rei de copas e Dama de ouros). Depois de aprovadas, faço as 52 cartas de cada uma.</p>
</header>
<main id="vitrine"></main>

<script>
// ---------- naipes (viewBox 0 0 100 100) ----------
const NAIPE = {
  espadas: 'M50 4C50 4 8 40 8 62c0 17 19 25 34 15-2 9-6 15-12 19h40c-6-4-10-10-12-19 15 10 34 2 34-15C92 40 50 4 50 4Z',
  copas:   'M50 93C50 93 5 61 5 33 5 17 17 6 31 6c9 0 16 6 19 12 3-6 10-12 19-12 14 0 26 11 26 27 0 28-45 60-45 60Z',
  ouros:   'M50 3 89 50 50 97 11 50Z',
};

function naipe(tipo, x, y, s, cor, extra = '') {
  return `<g transform="translate(${x - s / 2} ${y - s / 2}) scale(${s / 100})"><path d="${NAIPE[tipo]}" fill="${cor}" ${extra}/></g>`;
}

// ---------- emblemas das figuras ----------
const EMB = {
  gravata: (c, c2) => `<path d="M-46-22 0 0-46 22Z M46-22 0 0 46 22Z" fill="${c}"/><rect x="-9" y="-11" width="18" height="22" rx="4" fill="${c2}"/>`,
  perolas: (c) => Array.from({ length: 11 }, (_, i) => { const a = Math.PI * (0.15 + 0.7 * i / 10); return `<circle cx="${Math.cos(a) * -48}" cy="${Math.sin(a) * 40 - 18}" r="7" fill="${c}"/>`; }).join('') + `<circle cx="0" cy="34" r="11" fill="${c}"/>`,
  moeda: (c, c2) => `<circle r="44" fill="none" stroke="${c}" stroke-width="7"/><circle r="34" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="4 5"/><text y="20" text-anchor="middle" font-family="Chakra Petch" font-weight="700" font-size="58" fill="${c2}">₿</text>`,
  blocos: (c) => [[-30, 14], [0, -14], [30, 14]].map(([x, y]) => `<g transform="translate(${x} ${y})"><path d="M0-18 16-9V9L0 18-16 9V-9Z" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"/><path d="M-16-9 0 0 16-9M0 0V18" stroke="${c}" stroke-width="3" fill="none"/></g>`).join('') + `<path d="M-14 6-16 2M14 6 16 2" stroke="${c}" stroke-width="3"/>`,
  dados: (c, c2) => `<g transform="rotate(-14 -18 0)"><rect x="-56" y="-30" width="54" height="54" rx="10" fill="${c}"/>${[[-42, -16], [-16, 10], [-29, -3]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${c2}"/>`).join('')}</g><g transform="rotate(12 26 6)"><rect x="2" y="-20" width="54" height="54" rx="10" fill="${c2}" stroke="${c}" stroke-width="4"/>${[[16, -6], [42, -6], [16, 20], [42, 20]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${c}"/>`).join('')}</g>`,
  cerejas: (c, c2) => `<path d="M-20 18C-14-14 0-30 18-40M22 22C18-6 14-26 18-40" stroke="${c2}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M18-40c10-6 26-4 32 4-12 6-24 4-32-4Z" fill="${c2}"/><circle cx="-22" cy="28" r="20" fill="${c}"/><circle cx="24" cy="32" r="20" fill="${c}"/><circle cx="-29" cy="21" r="5" fill="#fff" opacity=".55"/><circle cx="17" cy="25" r="5" fill="#fff" opacity=".55"/>`,
  viseira: (c, c2) => `<path d="M-52 4C-40-26 40-26 52 4L40 20H-40Z" fill="none" stroke="${c}" stroke-width="5"/><path d="M-36 2H36L28 12H-28Z" fill="${c2}"/><path d="M-60 34H60" stroke="${c}" stroke-width="3" stroke-dasharray="10 6"/>`,
  losango: (c, c2) => `<path d="M0-50 40 0 0 50-40 0Z" fill="none" stroke="${c}" stroke-width="5"/><path d="M0-30 24 0 0 30-24 0Z" fill="${c2}"/><path d="M-58 0H-46M46 0H58M0-62V-54M0 54V62" stroke="${c}" stroke-width="4"/>`,
  coroa: (c, c2) => `<path d="M-50 26-56-28-26 2 0-40 26 2 56-28 50 26Z" fill="${c}" stroke="${c2}" stroke-width="3" stroke-linejoin="round"/><rect x="-52" y="26" width="104" height="12" rx="3" fill="${c2}"/>${[-30, 0, 30].map(x => `<circle cx="${x}" cy="32" r="4" fill="${c}"/>`).join('')}<circle cx="0" cy="-44" r="6" fill="${c2}"/>`,
  tiara: (c, c2) => `<path d="M-54 22C-40-6-20-20 0-32 20-20 40-6 54 22Z" fill="none" stroke="${c}" stroke-width="5"/>${[-34, -17, 0, 17, 34].map((x, i) => `<path d="M${x} ${18 - [6, 22, 40, 22, 6][i]}l7 10-7 10-7-10Z" fill="${c2}"/>`).join('')}<path d="M-56 26H56" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`,
  sol: (c, c2) => Array.from({ length: 12 }, (_, i) => `<path d="M0-58 7-40H-7Z" fill="${c2}" transform="rotate(${i * 30})"/>`).join('') + `<circle r="32" fill="${c}"/>`,
  hibisco: (c, c2) => Array.from({ length: 5 }, (_, i) => `<ellipse cx="0" cy="-28" rx="21" ry="30" fill="${c}" transform="rotate(${i * 72})"/>`).join('') + `<circle r="12" fill="${c2}"/><path d="M0 0 22-34" stroke="${c2}" stroke-width="4"/><circle cx="22" cy="-36" r="5" fill="${c2}"/>`,
};

// ---------- coleções ----------
const COLECOES = [
  {
    nome: 'Riviera Noir',
    texto: 'Cassino de gala dos anos 60: smoking, roleta e dourado sobre preto.',
    preco: 'Sugestão: ₿C 2.500',
    fonte: 'Bodoni Moda', peso: 800,
    face: '#f6efdf', moldura: '#b8913f', preto: '#151313', vermelho: '#8e1c26',
    figK: ['gravata', '#151313', '#b8913f'], figQ: ['perolas', '#b8913f'],
    verso: () => {
      const raios = Array.from({ length: 36 }, (_, i) => `<path d="M125 175 L${125 + Math.cos(i * Math.PI / 18) * 260} ${175 + Math.sin(i * Math.PI / 18) * 260}" stroke="#c9a24f" stroke-width="${i % 2 ? 0.8 : 2}" opacity=".55"/>`).join('');
      const casas = Array.from({ length: 24 }, (_, i) => `<path d="M125 175 L${125 + Math.cos(i * Math.PI / 12) * 46} ${175 + Math.sin(i * Math.PI / 12) * 46} A46 46 0 0 1 ${125 + Math.cos((i + 1) * Math.PI / 12) * 46} ${175 + Math.sin((i + 1) * Math.PI / 12) * 46}Z" fill="${i % 2 ? '#8e1c26' : '#151313'}"/>`).join('');
      return `<rect width="250" height="350" fill="#0e0d0c"/>${raios}
        <rect x="14" y="14" width="222" height="322" rx="6" fill="none" stroke="#c9a24f" stroke-width="2"/>
        <rect x="21" y="21" width="208" height="308" rx="3" fill="none" stroke="#c9a24f" stroke-width=".8"/>
        <circle cx="125" cy="175" r="62" fill="#0e0d0c" stroke="#c9a24f" stroke-width="3"/>${casas}
        <circle cx="125" cy="175" r="18" fill="#c9a24f"/><text x="125" y="181" text-anchor="middle" font-family="Bodoni Moda" font-weight="800" font-size="16" fill="#0e0d0c">RN</text>`;
    },
  },
  {
    nome: 'Satoshi',
    texto: 'Bitcoin e blockchain: circuito laranja sobre grafite, a cara do ₿C.',
    preco: 'Sugestão: ₿C 2.000',
    fonte: 'Chakra Petch', peso: 700,
    face: '#202326', moldura: '#f7931a', preto: '#eae6df', vermelho: '#f7931a', escura: true,
    figK: ['moeda', '#f7931a', '#eae6df'], figQ: ['blocos', '#f7931a'],
    verso: () => {
      const trilhas = [];
      for (let i = 0; i < 14; i++) {
        const y = 30 + i * 22, x1 = 20 + (i * 37) % 60, x2 = 230 - (i * 53) % 70;
        trilhas.push(`<path d="M${x1} ${y}H${x1 + 40}l12 12H${x2}" stroke="#f7931a" stroke-width="1.6" fill="none" opacity=".45"/><circle cx="${x1}" cy="${y}" r="3" fill="#f7931a" opacity=".7"/><circle cx="${x2}" cy="${y + 12}" r="3" fill="none" stroke="#f7931a" opacity=".7"/>`);
      }
      return `<rect width="250" height="350" fill="#1a1c1f"/>${trilhas.join('')}
        <rect x="12" y="12" width="226" height="326" rx="8" fill="none" stroke="#f7931a" stroke-width="2"/>
        <path d="M125 113 179 144V206L125 237 71 206V144Z" fill="#1a1c1f" stroke="#f7931a" stroke-width="4"/>
        <text x="125" y="200" text-anchor="middle" font-family="Chakra Petch" font-weight="700" font-size="74" fill="#f7931a">₿</text>`;
    },
  },
  {
    nome: 'Las Vegas 1970',
    texto: 'Letreiro de lâmpadas, fichas e cerejas: o cassino americano retrô.',
    preco: 'Sugestão: ₿C 1.500',
    fonte: 'Righteous', peso: 400,
    face: '#fbf3e2', moldura: '#c8102e', preto: '#1d1a17', vermelho: '#c8102e',
    figK: ['dados', '#c8102e', '#fbf3e2'], figQ: ['cerejas', '#c8102e', '#1f6b3a'],
    verso: () => {
      const lamp = [];
      for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; lamp.push(`<circle cx="${125 + Math.cos(a) * 70}" cy="${175 + Math.sin(a) * 92}" r="4.5" fill="#ffd66b" stroke="#c8102e" stroke-width="1"/>`); }
      return `<defs><pattern id="lv" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#c8102e"/><rect width="14" height="14" fill="#a50d26"/></pattern></defs>
        <rect width="250" height="350" fill="url(#lv)"/>
        <rect x="12" y="12" width="226" height="326" rx="10" fill="none" stroke="#fbf3e2" stroke-width="5"/>
        <ellipse cx="125" cy="175" rx="82" ry="104" fill="#fbf3e2"/>${lamp.join('')}
        <text x="125" y="165" text-anchor="middle" font-family="Righteous" font-size="34" fill="#c8102e">LUCKY</text>
        <text x="125" y="205" text-anchor="middle" font-family="Righteous" font-size="40" fill="#1d1a17">₿C</text>`;
    },
  },
  {
    nome: 'Cyber Neon',
    texto: 'Grade futurista e luz neon roxa e ciano, feita para jogar no escuro.',
    preco: 'Sugestão: ₿C 1.500',
    fonte: 'Audiowide', peso: 400,
    face: '#120a26', moldura: '#21e6f2', preto: '#21e6f2', vermelho: '#ff3fb4', escura: true, brilho: true,
    figK: ['viseira', '#21e6f2', '#ff3fb4'], figQ: ['losango', '#ff3fb4', '#21e6f2'],
    verso: () => {
      const linhas = [];
      for (let i = 0; i <= 10; i++) linhas.push(`<path d="M125 205 L${-125 + i * 50} 350" stroke="#21e6f2" stroke-width="1.2" opacity=".6"/>`);
      [212, 224, 242, 268, 304, 350].forEach(y => linhas.push(`<path d="M0 ${y}H250" stroke="#21e6f2" stroke-width="1.2" opacity=".6"/>`));
      const sol = [0, 1, 2, 3, 4, 5].map(i => `<rect x="60" y="${110 + i * 15}" width="130" height="${9 - i}" fill="#ff3fb4"/>`).join('');
      return `<defs><clipPath id="sol"><circle cx="125" cy="150" r="62"/></clipPath><filter id="neon"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <rect width="250" height="350" fill="#0b0518"/>
        <g clip-path="url(#sol)"><rect x="60" y="88" width="130" height="24" fill="#ff3fb4"/>${sol}</g>
        <rect y="205" width="250" height="145" fill="#0b0518" opacity=".55"/>
        <g filter="url(#neon)">${linhas.join('')}</g>
        <rect x="12" y="12" width="226" height="326" rx="8" fill="none" stroke="#ff3fb4" stroke-width="2.5" filter="url(#neon)"/>`;
    },
  },
  {
    nome: 'Ouro Imperial',
    texto: 'Barroco de palácio: arabescos dourados sobre bordô, rei e rainha clássicos.',
    preco: 'Sugestão: ₿C 3.000',
    fonte: 'Cinzel Decorative', peso: 900,
    face: '#f4e7c8', moldura: '#a8822f', preto: '#1f1712', vermelho: '#7a1424',
    figK: ['coroa', '#d4a640', '#7a1424'], figQ: ['tiara', '#7a1424', '#d4a640'],
    verso: () => `<defs><pattern id="oi" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#5e0f1c"/>
        <path d="M18 4C24 12 24 24 18 32 12 24 12 12 18 4ZM4 18C12 12 24 12 32 18 24 24 12 24 4 18Z" fill="none" stroke="#c99a3c" stroke-width="1.3" opacity=".75"/><circle cx="18" cy="18" r="2.4" fill="#c99a3c"/></pattern></defs>
        <rect width="250" height="350" fill="url(#oi)"/>
        <rect x="12" y="12" width="226" height="326" rx="6" fill="none" stroke="#d4a640" stroke-width="5"/>
        <rect x="22" y="22" width="206" height="306" rx="4" fill="none" stroke="#d4a640" stroke-width="1.2"/>
        <ellipse cx="125" cy="175" rx="58" ry="74" fill="#5e0f1c" stroke="#d4a640" stroke-width="4"/>
        <ellipse cx="125" cy="175" rx="48" ry="64" fill="none" stroke="#d4a640" stroke-width="1.2"/>
        <g transform="translate(125 168) scale(.62)">${EMB.coroa('#d4a640', '#5e0f1c')}</g>`,
  },
  {
    nome: 'Tropical Brasil',
    texto: 'Calçadão de Copacabana, folhas e sol: verde, amarelo e azul.',
    preco: 'Sugestão: ₿C 1.500',
    fonte: 'Bricolage Grotesque', peso: 800,
    face: '#ffffff', moldura: '#009c3b', preto: '#0b3d91', vermelho: '#00873a',
    figK: ['sol', '#ffdf00', '#f2a900'], figQ: ['hibisco', '#e8457a', '#ffdf00'],
    verso: () => {
      const ondas = [];
      for (let i = 0; i < 12; i++) ondas.push(`<path d="M-10 ${60 + i * 22} Q 20 ${48 + i * 22} 50 ${60 + i * 22} T 110 ${60 + i * 22} T 170 ${60 + i * 22} T 230 ${60 + i * 22} T 290 ${60 + i * 22}" stroke="#1b1b1b" stroke-width="9" fill="none"/>`);
      return `<defs><clipPath id="calcadao"><rect x="12" y="12" width="226" height="326" rx="10"/></clipPath></defs>
        <rect width="250" height="350" fill="#009c3b"/>
        <g clip-path="url(#calcadao)"><rect width="250" height="350" fill="#f5f0e3"/>${ondas.join('')}</g>
        <rect x="12" y="12" width="226" height="326" rx="10" fill="none" stroke="#009c3b" stroke-width="6"/>
        <path d="M125 104 205 175 125 246 45 175Z" fill="#ffdf00" stroke="#009c3b" stroke-width="4"/>
        <circle cx="125" cy="175" r="38" fill="#0b3d91"/>
        <path d="M89 168C110 160 142 162 161 176" stroke="#fff" stroke-width="5" fill="none"/>`;
    },
  },
];

// ---------- montagem das cartas ----------
function canto(c, rank, tipo, cor) {
  const fs = rank.length > 1 ? 30 : 38;
  const lado = (rot) => `<g ${rot}><text x="24" y="50" text-anchor="middle" font-family="${c.fonte}" font-weight="${c.peso}" font-size="${fs}" fill="${cor}">${rank}</text>${naipe(tipo, 24, 70, 22, cor)}</g>`;
  return lado('') + lado('transform="rotate(180 125 175)"');
}

function face(c, rank, tipo, figura) {
  const cor = tipo === 'espadas' ? c.preto : c.vermelho;
  const filtro = c.brilho ? 'filter="url(#glow-' + c.nome.replace(/\W/g, '') + ')"' : '';
  let centro;
  if (rank === 'A') {
    centro = naipe(tipo, 125, 175, 120, cor, filtro);
  } else {
    const [emb, a, b] = figura;
    centro = `<rect x="52" y="74" width="146" height="202" rx="8" fill="none" stroke="${c.moldura}" stroke-width="2" opacity=".85"/>
      <g transform="translate(125 150)" ${filtro}>${EMB[emb](a, b)}</g>
      <text x="125" y="252" text-anchor="middle" font-family="${c.fonte}" font-weight="${c.peso}" font-size="54" fill="${cor}" ${filtro}>${rank}</text>`;
  }
  const defs = c.brilho ? `<defs><filter id="glow-${c.nome.replace(/\W/g, '')}"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>` : '';
  return `<svg viewBox="0 0 250 350" role="img" aria-label="${rank === 'A' ? 'Ás' : rank === 'K' ? 'Rei' : 'Dama'} de ${tipo}, coleção ${c.nome}">${defs}
    <rect width="250" height="350" fill="${c.face}"/>
    <rect x="8" y="8" width="234" height="334" rx="7" fill="none" stroke="${c.moldura}" stroke-width="1.5" opacity=".7"/>
    ${canto(c, rank, tipo, cor)}${centro}</svg>`;
}

const vitrine = document.getElementById('vitrine');
vitrine.innerHTML = COLECOES.map(c => `
  <section class="colecao" aria-labelledby="t-${c.nome.replace(/\W/g, '')}">
    <div class="info">
      <h2 id="t-${c.nome.replace(/\W/g, '')}" style="font-family:'${c.fonte}';font-weight:${c.peso}">${c.nome}</h2>
      <p>${c.texto}</p>
      <span class="preco">${c.preco}</span>
    </div>
    <div class="mesa">
      <div class="carta verso"><svg viewBox="0 0 250 350" role="img" aria-label="Verso da coleção ${c.nome}">${c.verso()}</svg></div>
      <div class="carta">${face(c, 'A', 'espadas')}</div>
      <div class="carta">${face(c, 'K', 'copas', c.figK)}</div>
      <div class="carta">${face(c, 'Q', 'ouros', c.figQ)}</div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
