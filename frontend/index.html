    <script>
      // Aplica o tema visual antes do primeiro render (sem piscar). Ver src/core/temaVisual.js
      (function () {
        var p = 'sistema';
        try { p = localStorage.getItem('bitchager:tema') || 'sistema'; } catch (e) {}
        var t = p === 'claro' || p === 'escuro' ? p
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro');
        document.documentElement.setAttribute('data-tema', t);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'claro' ? '#DCD5C8' : '#1C1714');
      })();
